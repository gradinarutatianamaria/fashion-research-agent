<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Fashion Copilot</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  html, body { background: #1a1a1a; color: #fff; min-height: 100vh; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; position: relative; overflow-x: hidden; }

  .corner-img { position: fixed; z-index: 0; pointer-events: none; filter: drop-shadow(0 8px 20px rgba(0,0,0,0.5)); }
  #img-mask       { top: -2%;  left: -3%;  width: 15vw; max-width: 190px; }
  #img-claw       { top: -4%;  right: -4%; width: 20vw; max-width: 260px; }
  #img-fabric     { bottom: -6%; left: -6%; width: 17vw; max-width: 220px; }
  #img-bag        { bottom: 2%;  left: 20%; width: 17vw; max-width: 210px; }
  #img-shoes      { bottom: 0%;  right: 22%; width: 13vw; max-width: 170px; }
  #img-hair       { bottom: -4%; right: -5%; width: 18vw; max-width: 230px; }
  @media (max-width: 900px) { .corner-img { display: none; } }

  .header-title { font-size: 1.5rem; letter-spacing: 0.05em; margin-bottom: 10px; font-weight: 400; text-align: center; color: #e0e0e0; position: relative; z-index: 1; }
  .chrome-divider { display: block; height: 14px; width: 130px; margin: 0 auto 24px; background-size: contain; background-repeat: no-repeat; background-position: center; opacity: 0.9; position: relative; z-index: 1; }

  .card-container { background-color: #828282; width: 100%; max-width: 640px; border-radius: 24px; padding: 40px 32px 32px 32px; box-shadow: 0 12px 32px rgba(0,0,0,0.4); position: relative; z-index: 1; display: flex; flex-direction: column; min-height: 320px; }

  h2 { font-size: 1.85rem; font-weight: 400; margin-bottom: 28px; letter-spacing: 0.02em; color: #fff; line-height: 1.2; }
  h3.section-label { font-size: 0.75rem; letter-spacing: 0.05em; color: rgba(255,255,255,0.5); margin-bottom: 8px; text-transform: uppercase; }

  .options-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: auto; max-height: 60vh; overflow-y: auto; padding-right: 2px; }
  .option-item { background-color: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; padding: 16px 20px; display: flex; align-items: center; gap: 14px; cursor: pointer; transition: all .2s ease; font-size: 1.1rem; color: #f0f0f0; user-select: none; }
  .option-item:hover { background-color: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.3); }
  .option-item.selected { background-color: rgba(255,255,255,0.3); border-color: #fff; box-shadow: 0 0 0 1px #fff; }
  .option-icon { font-size: 1.3rem; width: 24px; display: flex; align-items: center; justify-content: center; }

  .goal-boxes { display: flex; flex-direction: column; gap: 16px; margin-bottom: auto; }
  .goal-box { background-color: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.15); border-radius: 14px; padding: 36px 24px; cursor: pointer; transition: all .2s ease; font-size: 1.15rem; color: #f0f0f0; text-align: center; }
  .goal-box:hover { background-color: rgba(255,255,255,0.2); }
  .goal-box.selected { background-color: rgba(255,255,255,0.3); border-color: #fff; box-shadow: 0 0 0 1px #fff; }

  .text-input-field, .textarea-field { background-color: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; padding: 16px 20px; color: #fff; font-size: 1.1rem; width: 100%; outline: none; transition: border-color .2s; }
  .text-input-field:focus, .textarea-field:focus { border-color: rgba(255,255,255,0.6); }
  .text-input-field::placeholder, .textarea-field::placeholder { color: rgba(255,255,255,0.5); }
  .textarea-field { height: 90px; resize: none; margin-bottom: 18px; }

  .stars-container { display: flex; justify-content: center; gap: 16px; margin: 32px 0; }
  .star { font-size: 2.5rem; color: rgba(255,255,255,0.6); cursor: pointer; transition: color .2s, transform .2s; }
  .star:hover, .star.selected { color: #fff; transform: scale(1.1); }

  .action-button { background-color: rgba(255,255,255,0.85); color: #333; border: none; border-radius: 30px; padding: 16px; font-size: 1.15rem; font-weight: 500; cursor: pointer; width: 100%; transition: background-color .2s, transform .1s; margin-top: 24px; letter-spacing: 0.02em; }
  .action-button:hover { background-color: #fff; }
  .action-button:active { transform: scale(0.98); }
  .action-button:disabled { opacity: 0.4; cursor: default; }
  .action-button.secondary { background: rgba(255,255,255,0.12); color: #fff; }

  .ghost-btn { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.12); color: #fff; border: 1px solid rgba(255,255,255,0.15); border-radius: 20px; padding: 8px 14px; font-size: 0.8rem; cursor: pointer; }
  .small-btn { display: inline-flex; align-items: center; gap: 4px; background: rgba(255,255,255,0.12); color: #fff; border: none; border-radius: 10px; padding: 6px 10px; font-size: 0.7rem; cursor: pointer; text-decoration: none; }

  .navigation-dots { display: flex; justify-content: center; gap: 8px; margin-top: 16px; position: relative; z-index: 1; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background-color: rgba(255,255,255,0.3); transition: background-color .2s; }
  .dot.active { background-color: #fff; }

  .row-item { background-color: rgba(255,255,255,0.12); border-radius: 12px; padding: 14px 16px; }
  .toggle { width: 34px; height: 18px; border-radius: 10px; position: relative; cursor: pointer; transition: background .2s; }
  .toggle .knob { width: 14px; height: 14px; border-radius: 50%; background: #333; position: absolute; top: 2px; transition: left .2s; }

  .lib-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; cursor: pointer; }
  .lib-row:hover { background: rgba(255,255,255,0.18); }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 3px; }

  @media (max-width: 600px) {
    .card-container { padding: 24px 16px 20px 16px; }
    h2 { font-size: 1.5rem; }
  }
  @media print {
    .no-print { display: none !important; }
    .corner-img, .header-title, .chrome-divider, .navigation-dots { display: none !important; }
    body { background: #fff; color: #000; }
    .card-container { background: #fff; color: #000; box-shadow: none; }
  }
</style>
</head>

<img id="img-hair" class="corner-img" alt="">

const API_BASE = window.__DOSSIER_API_BASE__ || "http://localhost:3001/api";

async function apiRequest(method, path, body) {
  let res;
  try {
    res = await fetch(`${API_BASE}${path}`, {
      method,
      headers: body ? { "Content-Type": "application/json" } : undefined,
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch {
    throw new Error(`Nu pot contacta serverul la ${API_BASE}. Rulează?`);
  }
  if (!res.ok) {
    const payload = await res.json().catch(() => ({}));
    throw new Error(payload.error || `Eroare server (${res.status})`);
  }
  if (res.status === 204) return null;
  return res.json();
}
const apiPost = (p, b) => apiRequest("POST", p, b);
const apiGet = (p) => apiRequest("GET", p);
const apiDelete = (p) => apiRequest("DELETE", p);

  { label: "Australia și Oceania", key: "Australia and Oceania" },
  { label: "Global", key: "Global" },
];
const TIMELINES = [
  { label: "Ultimele 12 luni", key: "Last 12 months" },
  { label: "Ultimii 5 ani", key: "Last 5 years" },
  { label: "Ultimul deceniu", key: "Last decade" },
  { label: "Toată perioada", key: "All time" },
  { label: "Personalizat", key: "Custom" },
];
const REPORT_TYPES = [
  { emoji: "📚", label: "Revizuire a literaturii", value: "literature_review" },
  { emoji: "📄", label: "Rezumat executiv", value: "executive_summary" },
  { emoji: "📊", label: "Analiză SWOT", value: "swot" },
  { emoji: "🎤", label: "Schiță de prezentare", value: "presentation_outline" },
  { emoji: "📈", label: "Raport de marketing", value: "marketing_report" },
  { emoji: "🌱", label: "Raport de sustenabilitate", value: "sustainability_report" },
];
const CONFIDENCE_RO = { High: "Ridicată", Medium: "Medie", Low: "Scăzută" };
const STEP_ORDER = ["areas","goal","region","timeline","search","rating","feedback"];

/* ============ state ============ */
let state = {
  step: "areas",
  area: "", goal: "", region: "", timeline: "", customFrom: "", customTo: "",
  topic: "", depth: 3, curatedOnly: true,
  phase: "idle", subquestions: [], error: "",
  reportType: null, report: null,
  libraryOpen: false, library: [], libraryLoading: false, libraryError: "",
  savedId: null, saving: false,
  sessionRating: 0, likedText: "", improveText: "",
};

function buildContext() {
  return {
    areas: state.area ? [state.area] : [],
    goal: state.goal,
    region: state.region,
    countries: [],
    timeline: state.timeline === "Custom" ? `Custom (${state.customFrom || "?"}–${state.customTo || "?"})` : state.timeline,
  };
}

function reset() {
  state = { step: "areas", area: "", goal: "", region: "", timeline: "", customFrom: "", customTo: "",
    topic: "", depth: 3, curatedOnly: true, phase: "idle", subquestions: [], error: "",
    reportType: null, report: null, libraryOpen: false, library: [], libraryLoading: false, libraryError: "",
    savedId: null, saving: false, sessionRating: 0, likedText: "", improveText: "" };
  render();
}

function selectAndAdvance(field, val, nextStep) {
  state[field] = val;
  render();
  setTimeout(() => { state.step = nextStep; render(); }, 250);
}

/* ============ research pipeline ============ */
async function runResearch() {
  state.error = ""; state.report = null; state.reportType = null; state.subquestions = [];
  state.phase = "planning"; render();
  const context = buildContext();
  try {
    const plan = await apiPost("/plan", { topic: state.topic, depth: state.depth, context });
    state.subquestions = plan.subquestions.map((q, i) => ({ id: i, question: q, status: "pending", answer: "", sources: [] }));
    state.phase = "researching"; render();

    for (let i = 0; i < state.subquestions.length; i++) {
      state.subquestions[i].status = "searching"; render();
      const result = await apiPost("/search", { question: state.subquestions[i].question, topic: state.topic, context, curatedOnly: state.curatedOnly });
      state.subquestions[i] = { ...state.subquestions[i], status: "done", answer: result.answer || "", sources: result.sources || [], usedFallback: !!result.usedFallback };
      render();
    }
    state.phase = "ready"; render();
  } catch (e) {
    state.error = e.message || "A apărut o eroare."; state.phase = "error"; render();
  }
}

async function generateReport(type) {
  state.reportType = type; state.phase = "generating"; state.error = ""; render();
  try {
    const findings = state.subquestions.map(s => ({ question: s.question, answer: s.answer }));
    state.report = await apiPost("/report", { type, topic: state.topic, context: buildContext(), findings });
    state.phase = "done"; render();
  } catch (e) {
    state.error = e.message || "A apărut o eroare."; state.phase = "error"; render();
  }
}

async function fetchLibrary() {
  state.libraryLoading = true; state.libraryError = ""; render();
  try {
    const { dossiers } = await apiGet("/dossiers");
    state.library = dossiers;
  } catch (e) {
    state.libraryError = e.message || "Nu am putut încărca biblioteca.";
  } finally { state.libraryLoading = false; render(); }
}
function toggleLibrary() {
  state.libraryOpen = !state.libraryOpen; render();
  if (state.libraryOpen) fetchLibrary();
}
async function loadDossier(id) {
  try {
    const d = await apiGet(`/dossiers/${id}`);
    state.topic = d.topic; state.depth = d.depth || 3;
    state.area = (d.context?.areas || [])[0] || "";
    state.goal = d.context?.goal || ""; state.region = d.context?.region || ""; state.timeline = d.context?.timeline || "";
    state.subquestions = d.subquestions || []; state.reportType = d.reportType; state.report = d.report;
    state.savedId = d.id; state.phase = "done"; state.libraryOpen = false; render();
  } catch (e) { state.libraryError = e.message || "Nu am putut deschide acest dosar."; render(); }
}
async function removeDossier(id, ev) {
  ev.stopPropagation();
  try {
    await apiDelete(`/dossiers/${id}`);
    state.library = state.library.filter(d => d.id !== id);
    if (state.savedId === id) state.savedId = null;
    render();
  } catch (e) { state.libraryError = e.message || "Nu am putut șterge acest dosar."; render(); }
}
async function saveCurrentDossier() {
  if (!state.report) return;
  state.saving = true; state.error = ""; render();
  try {
    const record = await apiPost("/dossiers", { topic: state.topic, depth: state.depth, context: buildContext(), reportType: state.reportType, report: state.report, subquestions: state.subquestions });
    state.savedId = record.id;
  } catch (e) { state.error = e.message || "Nu am putut salva acest dosar."; }
  finally { state.saving = false; render(); }
}

function downloadWordDoc() {
  const r = state.report; if (!r) return;
  const typeLabel = REPORT_TYPES.find(t => t.value === state.reportType)?.label || "Raport";
  const findingsHtml = r.keyFindings.map(f => `<li>${f}</li>`).join("");
  const timelineHtml = (r.timeline || []).map(t => `<li><strong>${t.period}:</strong> ${t.event}</li>`).join("");
  const followUpsHtml = (r.followUps || []).map(f => `<li>${f}</li>`).join("");
  const sourcesHtml = state.subquestions.flatMap(s => s.sources || []).map(s => `<li><a href="${s.url}">${s.title || s.url}</a></li>`).join("");
  const html = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
    <head><meta charset='utf-8'><title>${state.topic}</title>
    <style>body{font-family:Georgia,serif;color:#1a1a1a;line-height:1.5;}h1{font-size:22pt;margin-bottom:2pt;}h2{font-size:13pt;color:#828282;margin-top:18pt;}.meta{font-size:9pt;color:#828282;font-family:Consolas,monospace;}li{margin-bottom:6pt;}</style></head>
    <body><div class="meta">THE FASHION COPILOT — ${typeLabel.toUpperCase()}</div><h1>${state.topic}</h1><p>${r.executiveSummary}</p>
    <h2>Constatări cheie</h2><ul>${findingsHtml}</ul><h2>Cronologie</h2><ul>${timelineHtml}</ul>
    <h2>Evaluarea încrederii</h2><p>${CONFIDENCE_RO[r.confidence?.level] || r.confidence?.level}: ${r.confidence?.note}</p>
    <h2>Întrebări de urmărire sugerate</h2><ul>${followUpsHtml}</ul><h2>Surse</h2><ul>${sourcesHtml}</ul></body></html>`;
  const blob = new Blob(["\ufeff", html], { type: "application/msword" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = `${state.topic.slice(0,40).replace(/[^a-z0-9]+/gi,"-") || "dosar"}.doc`;
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
}
function printDossier() { window.print(); }

/* ============ rendering ============ */
function esc(s) { const d = document.createElement('div'); d.textContent = s ?? ""; return d.innerHTML; }

function renderDots() {
  const dotsEl = document.getElementById('nav-dots');
  const effectiveStep = state.step === 'custom' ? 'timeline' : state.step;
  const showDots = (state.phase === 'idle' && STEP_ORDER.includes(effectiveStep)) ||
                    (state.phase === 'done' && ['rating','feedback'].includes(state.step));
  if (!showDots) { dotsEl.innerHTML = ""; return; }
  const idx = STEP_ORDER.indexOf(effectiveStep);
  dotsEl.innerHTML = STEP_ORDER.map((s,i) => `<div class="dot ${i===idx?'active':''}"></div>`).join("");
}

function optionRow({active, onclick, label, icon}) {
  return `<div class="option-item ${active?'selected':''}" onclick="${onclick}">
    ${icon ? `<span class="option-icon">${icon}</span>` : ""}
    <span>${esc(label)}</span>
  </div>`;
}

function starsHtml(value, onclickFn) {
  let out = '<div class="stars-container">';
  for (let n=1;n<=5;n++) out += `<span class="star ${n<=value?'selected':''}" onclick="${onclickFn}(${n})">${n<=value?'★':'☆'}</span>`;
  return out + '</div>';
}

function render() {
  const app = document.getElementById('app');
  renderDots();

  if (state.phase === "idle") {
    if (state.step === "areas") {
      app.innerHTML = `<div class="card-container">
        <h2>Ce cercetăm în modă?</h2>
        <div class="options-list">${RESEARCH_AREAS.map(a => optionRow({active: state.area===a.key, onclick:`selectAndAdvance('area','${a.key}','goal')`, label:a.label, icon:a.emoji})).join("")}</div>
      </div>`;
      return;
    }
    if (state.step === "goal") {
      app.innerHTML = `<div class="card-container">
        <h2>Care este scopul tău?</h2>
        <div class="goal-boxes">${GOALS.map(g => `<div class="goal-box ${state.goal===g.key?'selected':''}" onclick="selectAndAdvance('goal','${g.key}','region')">${esc(g.label)}</div>`).join("")}</div>
      </div>`;
      return;
    }
    if (state.step === "region") {
      app.innerHTML = `<div class="card-container">
        <h2>Regiune</h2>
        <div class="options-list">${REGIONS.map(r => optionRow({active: state.region===r.key, onclick:`selectAndAdvance('region','${r.key}','timeline')`, label:r.label})).join("")}</div>
      </div>`;
      return;
    }
    if (state.step === "timeline") {
      app.innerHTML = `<div class="card-container">
        <h2>Perioadă</h2>
        <div class="options-list">${TIMELINES.map(t => optionRow({active: state.timeline===t.key, onclick:`selectAndAdvance('timeline','${t.key}','${t.key==="Custom"?"custom":"search"}')`, label:t.label})).join("")}</div>
      </div>`;
      return;
    }
    if (state.step === "custom") {
      app.innerHTML = `<div class="card-container">
        <h2>Perioadă personalizată</h2>
        <div style="display:flex;gap:12px;margin-bottom:20px;">
          <input class="text-input-field" placeholder="De la (ex. 2015)" value="${esc(state.customFrom)}" oninput="state.customFrom=this.value; syncNextBtn()">
          <input class="text-input-field" placeholder="Până la (ex. 2025)" value="${esc(state.customTo)}" oninput="state.customTo=this.value; syncNextBtn()">
        </div>
        <button class="action-button" id="custom-next" onclick="state.step='search'; render()" ${(!state.customFrom||!state.customTo)?'disabled':''}>Următorul</button>
      </div>`;
      return;
    }
    if (state.step === "search") {
      app.innerHTML = `<div class="card-container">
        <input class="text-input-field" style="margin-bottom:10px;" placeholder="subiectul cercetat" value="${esc(state.topic)}"
          oninput="state.topic=this.value; syncStartBtn()" onkeydown="if(event.key==='Enter' && state.topic.trim()) runResearch()">
        <h2 style="font-size:1.5rem;margin-top:10px;">Profunzimea căutării</h2>
        ${starsHtml(state.depth, 'setDepth')}
        <div style="display:flex;align-items:center;gap:10px;cursor:pointer;margin-bottom:8px;" onclick="state.curatedOnly=!state.curatedOnly; render()">
          <div class="toggle" style="background:${state.curatedOnly?'rgba(255,255,255,0.7)':'rgba(255,255,255,0.2)'}">
            <div class="knob" style="left:${state.curatedOnly?'18px':'2px'}"></div>
          </div>
          <span style="font-size:0.8rem;color:rgba(255,255,255,0.6);">doar surse de modă verificate</span>
        </div>
        <button class="action-button" id="start-btn" onclick="runResearch()" ${!state.topic.trim()?'disabled':''}>Începe cercetarea</button>
        ${state.error ? `<p style="color:#fff;font-size:0.8rem;margin-top:12px;">${esc(state.error)}</p>` : ""}
      </div>`;
      return;
    }
  }

  // library toggle bar
  let libraryBar = `<div style="width:100%;max-width:640px;display:flex;justify-content:flex-end;margin-bottom:10px;position:relative;z-index:1;" class="no-print">
    <span class="ghost-btn" onclick="toggleLibrary()">📂 Bibliotecă</span>
  </div>`;

  let libraryPanel = "";
  if (state.libraryOpen) {
    libraryPanel = `<div class="card-container no-print" style="margin-bottom:14px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <span style="font-size:0.75rem;letter-spacing:0.05em;color:rgba(255,255,255,0.5);">DOSARE SALVATE</span>
        <span style="cursor:pointer;" onclick="state.libraryOpen=false; render()">✕</span>
      </div>
      ${state.libraryLoading ? `<p style="font-size:0.8rem;color:rgba(255,255,255,0.6);">se încarcă…</p>` : ""}
      ${state.libraryError ? `<p style="font-size:0.8rem;color:#fff;">${esc(state.libraryError)}</p>` : ""}
      ${(!state.libraryLoading && !state.libraryError && state.library.length===0) ? `<p style="font-size:0.8rem;color:rgba(255,255,255,0.6);">niciun dosar salvat încă</p>` : ""}
      <div style="display:flex;flex-direction:column;gap:8px;">
        ${state.library.map(d => {
          const t = REPORT_TYPES.find(rt => rt.value === d.reportType);
          return `<div class="row-item lib-row" onclick="loadDossier('${d.id}')">
            <div style="min-width:0;">
              <p style="font-size:0.9rem;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${t?.emoji||""} ${esc(d.topic)}</p>
              <p style="font-size:0.7rem;color:rgba(255,255,255,0.5);">${t?.label||""} · ${new Date(d.createdAt).toLocaleDateString('ro-RO')}</p>
            </div>
            <span onclick="removeDossier('${d.id}', event)" style="flex-shrink:0;">🗑️</span>
          </div>`;
        }).join("")}
      </div>
    </div>`;
  }

  let mainPanel = "";

  if (state.phase === "planning" || state.phase === "researching") {
    mainPanel = `<div class="card-container">
      <p style="font-size:0.85rem;color:rgba(255,255,255,0.6);margin-bottom:16px;">${state.phase==="planning"?"se planifică cercetarea…":"se cercetează…"}</p>
      <div style="display:flex;flex-direction:column;gap:12px;">
        ${state.subquestions.map((s,idx) => `<div class="row-item">
          <p style="font-size:0.7rem;color:rgba(255,255,255,0.5);margin-bottom:4px;">
            ${String(idx+1).padStart(2,'0')} — ${s.status==='pending'?'în așteptare':s.status==='searching'?'se caută…':'finalizat'}${s.usedFallback?' · web deschis':''}
          </p>
          <p style="font-size:0.95rem;color:#fff;">${esc(s.question)}</p>
          ${s.answer ? `<p style="font-size:0.9rem;color:#f0f0f0;margin-top:6px;">${esc(s.answer)}</p>` : ""}
        </div>`).join("")}
      </div>
    </div>`;
  } else if (state.phase === "ready") {
    mainPanel = `<div class="card-container">
      <h2 style="font-size:1.4rem;">Rezultate de cercetare disponibile</h2>
      <div style="display:flex;flex-direction:column;gap:10px;">
        ${REPORT_TYPES.map(t => `<div class="option-item" onclick="generateReport('${t.value}')"><span class="option-icon">${t.emoji}</span><span>${esc(t.label)}</span></div>`).join("")}
      </div>
    </div>`;
  } else if (state.phase === "generating") {
    mainPanel = `<p style="color:#fff;font-size:0.85rem;">se generează ${REPORT_TYPES.find(t=>t.value===state.reportType)?.label.toLowerCase()}…</p>`;
  } else if (state.report && !["rating","feedback"].includes(state.step)) {
    const r = state.report;
    const chartMax = Math.max(1, ...state.subquestions.map(s => (s.sources||[]).length));
    mainPanel = `<div class="card-container printable-area">
      <div class="no-print" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <span style="font-size:0.75rem;letter-spacing:0.05em;color:rgba(255,255,255,0.5);">${(REPORT_TYPES.find(t=>t.value===state.reportType)?.label||"").toUpperCase()}</span>
        <div style="display:flex;gap:8px;">
          <button class="small-btn" onclick="saveCurrentDossier()" ${state.saving||state.savedId?'disabled':''}>💾 ${state.savedId?'Salvat':'Salvează'}</button>
          <button class="small-btn" onclick="printDossier()">🖨️ PDF</button>
          <button class="small-btn" onclick="downloadWordDoc()">⬇️ .DOC</button>
        </div>
      </div>
      <p style="font-size:0.85rem;color:rgba(255,255,255,0.6);margin-bottom:4px;">${esc(state.topic)}</p>
      <p style="font-size:1.3rem;color:#fff;margin-bottom:20px;">${esc(r.executiveSummary)}</p>

      <h3 class="section-label">Constatări cheie</h3>
      <ul style="margin-bottom:20px;list-style:none;">
        ${(r.keyFindings||[]).map(f => `<li style="font-size:0.9rem;color:#fff;margin-bottom:8px;display:flex;gap:8px;"><span>📌</span><span>${esc(f)}</span></li>`).join("")}
      </ul>

      ${(r.timeline&&r.timeline.length>0) ? `<h3 class="section-label">Cronologie</h3>
      <div style="margin-bottom:20px;padding-left:12px;border-left:2px solid rgba(255,255,255,0.15);">
        ${r.timeline.map(t => `<div style="margin-bottom:8px;"><span style="font-size:0.75rem;color:#fff;">${esc(t.period)}</span><p style="font-size:0.9rem;color:#f0f0f0;">${esc(t.event)}</p></div>`).join("")}
      </div>` : ""}

      ${state.subquestions.length>0 ? `<h3 class="section-label">Acoperirea cercetării</h3>
      <div style="display:flex;align-items:flex-end;gap:10px;height:100px;margin-bottom:20px;">
        ${state.subquestions.map((s,i) => {
          const n=(s.sources||[]).length; const h = Math.max(6, Math.round((n/chartMax)*80));
          return `<div style="display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;">
            <div style="width:100%;height:${h}px;background:#fff;border-radius:3px 3px 0 0;"></div>
            <span style="font-size:0.65rem;color:rgba(255,255,255,0.5);">Î${i+1}</span>
          </div>`;
        }).join("")}
      </div>` : ""}

      <h3 class="section-label">Surse și referințe</h3>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;">
        ${state.subquestions.flatMap(s=>s.sources||[]).map(src => `<a class="small-btn" href="${src.url}" target="_blank" rel="noopener noreferrer">🔗 ${esc(src.title||src.url)}</a>`).join("")}
      </div>

      ${r.confidence ? `<div class="row-item" style="display:flex;gap:8px;margin-bottom:20px;">
        <span>✅</span>
        <div><span style="font-size:0.75rem;color:#fff;">Încredere ${CONFIDENCE_RO[r.confidence.level]||r.confidence.level}</span>
        <p style="font-size:0.9rem;color:#f0f0f0;">${esc(r.confidence.note)}</p></div>
      </div>` : ""}

      ${(r.followUps&&r.followUps.length>0) ? `<div style="padding-top:16px;margin-bottom:20px;border-top:1px dashed rgba(255,255,255,0.15);">
        <h3 class="section-label">❓ Întrebări de urmărire sugerate</h3>
        <ul style="list-style:none;">${r.followUps.map(f => `<li style="font-size:0.9rem;color:#f0f0f0;font-style:italic;margin-bottom:6px;">— ${esc(f)}</li>`).join("")}</ul>
      </div>` : ""}

      <button class="action-button no-print" onclick="state.step='rating'; render()">Finalizează și evaluează</button>
      <button class="action-button secondary no-print" style="margin-top:10px;" onclick="reset()">↺ Subiect nou</button>
    </div>`;
  } else if (state.phase === "done" && state.step === "rating") {
    mainPanel = `<div class="card-container">
      <h2>Cum ai evalua această experiență?</h2>
      ${starsHtml(state.sessionRating, 'setSessionRating')}
      <button class="action-button" onclick="state.step='feedback'; render()" ${state.sessionRating===0?'disabled':''}>Următorul</button>
    </div>`;
  } else if (state.phase === "done" && state.step === "feedback") {
    mainPanel = `<div class="card-container">
      <h2 style="font-size:1.3rem;">Ce ți-a plăcut la acest copilot?</h2>
      <textarea class="textarea-field" oninput="state.likedText=this.value">${esc(state.likedText)}</textarea>
      <h2 style="font-size:1.3rem;">Ce ar trebui să îmbunătățim?</h2>
      <textarea class="textarea-field" oninput="state.improveText=this.value">${esc(state.improveText)}</textarea>
      <button class="action-button" onclick="reset()">Finalizează</button>
    </div>`;
  } else if (state.phase === "error") {
    mainPanel = `<div class="card-container">
      <p style="color:#fff;font-size:0.9rem;">${esc(state.error)}</p>
      <button class="action-button" onclick="state.phase='idle'; render()">Înapoi</button>
    </div>`;
  }

  app.innerHTML = libraryBar + libraryPanel + mainPanel;
}

function setDepth(n) { state.depth = n; render(); }
function setSessionRating(n) { state.sessionRating = n; render(); }
function syncStartBtn() { const b=document.getElementById('start-btn'); if(b) b.disabled = !state.topic.trim(); }
function syncNextBtn() { const b=document.getElementById('custom-next'); if(b) b.disabled = !(state.customFrom && state.customTo); }

window.selectAndAdvance = selectAndAdvance;
window.runResearch = runResearch;
window.generateReport = generateReport;
window.toggleLibrary = toggleLibrary;
window.loadDossier = loadDossier;
window.removeDossier = removeDossier;
window.saveCurrentDossier = saveCurrentDossier;
window.downloadWordDoc = downloadWordDoc;
window.printDossier = printDossier;
window.reset = reset;
window.setDepth = setDepth;
window.setSessionRating = setSessionRating;
window.syncStartBtn = syncStartBtn;
window.syncNextBtn = syncNextBtn;
window.state = state;

render();
</script>
</body>
</html>
